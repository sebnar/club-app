services:
  - type: web
    name: jetta-club-backend
    env: python
    runtime: python-3.11
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: jetta_club
      - key: SECRET_KEY
        sync: false
        # IMPORTANTE: Genera una clave secreta aleatoria para JWT
        # Puedes generar una con: python -c "import secrets; print(secrets.token_urlsafe(32))"
      - key: MAILERSEND_API_KEY
        sync: false
        # API Key de MailerSend (obtener en https://app.mailersend.com/api-tokens)
        # Ejemplo: mlsn.1186bae72fb7e8b9d4988d1e8fcf243c427ba0ab7162c8ab034b4700fa740829
      - key: EMAIL_FROM
        sync: false
        # Email remitente verificado en MailerSend
        # Ejemplo: info@domain.com o tu-email@tu-dominio.com
      - key: EMAIL_FROM_NAME
        value: "Club Volkswagen Jetta Colombia"
        # Nombre que aparecerá como remitente
      - key: FRONTEND_URL
        sync: false
        # URL del frontend (para links en emails)

  - type: web
    name: jetta-club-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run preview -- --port $PORT --host 0.0.0.0
    envVars:
      - key: VITE_API_URL
        sync: false
        # IMPORTANTE: Después de desplegar el backend, reemplaza esta URL
        # con la URL real de tu backend (ej: https://jetta-club-backend.onrender.com)
        value: https://jetta-club-backend.onrender.com

